# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  # Update .github/workflows/doc-build.yml when changing OS, Python or dependencies
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
  jobs:
    install:
      - python -m pip install uv
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --torch-backend=cpu -e ".[doc,opt]"
      # Comment this temporary override after the GeoUtils accessor release
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --upgrade --reinstall --no-deps "geoutils @ git+https://github.com/GlacioHack/geoutils.git@main"

# Build documentation in the doc/ directory with Sphinx
sphinx:
  configuration: doc/source/conf.py
  fail_on_warning: false

# Build the doc in offline formats
formats:
  - htmlzip
