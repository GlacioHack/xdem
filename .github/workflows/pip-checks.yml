# This workflow checks that pip installation works to import the package (tests are in python-tests.yml)

name: pip-install

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.os }}, python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Use pip install
      - name: Install project
        run: |
          python -m pip install . -vv

      # Comment this temporary override after the GeoUtils accessor release
      - name: Install latest GeoUtils main
        run: python -m pip install --upgrade --force-reinstall --no-deps "geoutils @ git+https://github.com/GlacioHack/geoutils.git@main"

      # Check import works
      - name: Check import works with base environment
        run: python -c "import xdem"
