[metadata]
author = xDEM developers
name = xdem
description = Analysis of digital elevation models and elevation point clouds
keywords = dem, elevation, geoutils, xarray
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
platform = any
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: GIS
    Topic :: Scientific/Engineering :: Image Processing
    Topic :: Scientific/Engineering :: Information Analysis
    Programming Language :: Python
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3
    Topic :: Software Development :: Libraries :: Python Modules
    Typing :: Typed
url = https://github.com/GlacioHack/xdem
download_url = https://pypi.org/project/xdem/

[options]
packages = find:
zip_safe = False # https://mypy.readthedocs.io/en/stable/installed_packages.html
include_package_data = True
python_requires = >=3.10,<3.15
# Avoid pinning dependencies in requirements.txt (which we don't do anyways, and we rely mostly on Conda)
# (https://caremad.io/posts/2013/07/setup-vs-requirement/, https://github.com/pypa/setuptools/issues/1951)
install_requires = file: requirements.txt

[options.package_data]
xdem =
    py.typed

[options.packages.find]
include =
    xdem
    xdem.*

[options.extras_require]
gstat =
    scikit-gstat>=1.0.23
    gstools>=1.3
    gpytorch>=1.11
    torch>=2
cloud =
    fsspec[http,s3]
    fiona>=1.10
    rasterio>=1.4
io =
    laspy[lazrs]
    pyarrow>=14
    geopandas>=1.1
    netcdf4
    zarr
paral =
    dask
    distributed
    dask-geopandas
num =
    numba
    flox
    crick
    exactextract>=0.3
plot =
    matplotlib
prof =
    psutil
    plotly
opt =
    %(gstat)s
    %(cloud)s
    %(io)s
    %(paral)s
    %(num)s
    %(plot)s
    %(prof)s
    scikit-learn
    linear_operator
    pyyaml
    plutoprint
benchmark =
    %(opt)s
    asv
    pytest>=8,<10
test =
    %(opt)s
    gdal
    pdal
    pytest>=8,<10
    pytest-xdist
    pytest-lazy-fixtures
    pytest-instafail
    pytest-socket
    pytest-cov
    sybil[pytest]>=9.3,<10
    coveralls
    pylint
    pre-commit
doc =
    sphinx
    sphinx-book-theme
    sphinxcontrib-programoutput
    sphinx-design
    sphinx-autodoc-typehints
    sphinx-gallery
    sphinx-argparse
    autovizwidget
    graphviz
    myst-nb
    numpydoc
    typing-extensions
    sphinx-tabs
    netcdf4
    zarr
    pytest>=8,<10
dev =
    %(benchmark)s
    %(doc)s
    %(test)s
all =
    %(dev)s

[options.entry_points]
console_scripts =
    xdem = xdem.cli:main
