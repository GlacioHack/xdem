[build-system]
# Minimum requirements for the build system to execute.
requires = [
    "setuptools>=64",
    "setuptools_scm[toml]>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

# To write version to file
[tool.setuptools_scm]
version_file = "xdem/_version.py"
fallback_version = "0.0.1"
# Use no-local-version by default for CI builds
local_scheme = "no-local-version"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["B028", "B9", "C408", "E203", "E226", "E24"]
preview = true
select = ["B", "C4", "E", "F", "W"]

[tool.mypy]
allow_untyped_decorators = true
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --doctest-modules --doctest-ignore-import-errors -W error::UserWarning"
log_level = "INFO"
testpaths = [
	"tests",
	"xdem",
    "benchmarks/test_large_data.py"
]
